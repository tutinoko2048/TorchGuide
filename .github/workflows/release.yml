name: Draft release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check tag version
        run: |
          version="$(sed -n 's/^mod\.version = "\(.*\)"$/\1/p' stonecutter.properties.toml)"
          test "$GITHUB_REF_NAME" = "v$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build mod
        run: bash ./gradlew buildAndCollect --no-daemon
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/torchguide-"${MOD_VERSION}"+*.jar --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
